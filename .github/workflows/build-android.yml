name: Build Android APK

on:
  push:
    branches:
      - claude/ptsd-shield-app-lUHKl
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --output ./ptsd-shield.apk

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "PTSD Shield — Android APK (${{ steps.sha.outputs.short }})"
          body: |
            ## PTSD Shield Android APK

            Built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            ### Install on Android
            1. Download **ptsd-shield.apk** below
            2. Open the file on your Android phone
            3. If prompted, enable **"Install unknown apps"** in Settings → Security
            4. Tap Install → Open

            ### First launch
            - Sign in with Google
            - Go to **Settings** to select your trigger sounds
            - Go to **Shield** → tap **Test Soundscape** (wear headphones)
            - Tap **Start Shield** to activate real-time monitoring

            > **Note:** YAMNet sound classification is active in this build. Microphone permission is required.
          files: ./ptsd-shield.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
